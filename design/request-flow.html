<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>请求链路动画 · 设计稿</title>
<style>
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --sub: #12151b; --line: #262a33; --text: #e6e8ec; --muted: #8a909c; --faint: #4b5160;
    --pkt: #5b9cff; --tunnel: #2dd4bf; --tunnel-fill: rgba(45, 212, 191, .07); --tls: #f5b947;
    --ok: #22c55e; --bad: #f05252;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f4f5f7; --sub: #fcfcfb; --line: #e3e5e9; --text: #16181d; --muted: #6b7280; --faint: #c4c8cf;
    --pkt: #2563eb; --tunnel: #0d9488; --tunnel-fill: rgba(13, 148, 136, .07); --tls: #b7791f;
    --ok: #16a34a; --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; }
  .bar { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 18px; }
  .bar h1 { font-size: 17px; margin: 0; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--sub); color: var(--text); padding: 6px 12px; border-radius: 6px; font: inherit; font-size: 13px; }
  .card { max-width: 900px; margin: 0 auto 18px; background: var(--sub); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 12px; }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  .card p { margin: 0; font-size: 12px; color: var(--muted); }
  svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* 路线与节点 */
  .route { stroke: var(--line); stroke-width: 2; }
  .seg { stroke: var(--line); stroke-width: 2; fill: none; transition: stroke .3s; }
  [data-s="ok"] .seg { stroke: var(--ok); }
  .node { fill: var(--sub); stroke: var(--faint); stroke-width: 2; }
  .ripple { fill: none; stroke: var(--ok); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .st-name { font-size: 12.5px; font-weight: 600; fill: var(--text); text-anchor: middle; }
  .st-addr { font-size: 11px; fill: var(--muted); text-anchor: middle; font-family: ui-monospace, Menlo, monospace; }

  /* 层标签 */
  .lb { font-size: 11.5px; fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; transition: fill .3s; }
  .lb .ms { font-weight: 600; }
  [data-s="ok"] .lb { fill: var(--text); }
  [data-s="bad"] .lb { fill: var(--bad); }
  [data-s="skip"] { opacity: .35; }

  /* L2 隧道 */
  .tube { fill: var(--tunnel-fill); stroke: var(--tunnel); stroke-width: 1.5; stroke-opacity: .35; transition: stroke-opacity .4s; }
  [data-s="run"] .tube, [data-s="ok"] .tube { stroke-opacity: 1; }
  .sheen { stroke: #fff; stroke-opacity: .18; stroke-width: 1.5; stroke-linecap: round; }
  [data-theme="light"] .sheen { stroke-opacity: .9; }
  .cipher { stroke: var(--tunnel); stroke-width: 1.5; stroke-dasharray: 2 9; opacity: 0; transition: opacity .4s; }
  [data-s="run"] .cipher, [data-s="ok"] .cipher { opacity: .5; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -22; } }

  /* L3 TCP 段 */
  .tcp { stroke: var(--line); stroke-width: 2; transition: stroke .3s; }
  [data-s="ok"] .tcp { stroke: var(--ok); }
  [data-s="bad"] .tcp { stroke: var(--bad); stroke-dasharray: 4 4; }
  .flag { font-size: 10.5px; font-weight: 600; fill: var(--pkt); text-anchor: middle; opacity: 0; letter-spacing: .02em; }

  /* L4 TLS 拱桥 */
  .arc-bg { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 5; }
  .arc { fill: none; stroke: var(--tls); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .lock-body { fill: var(--sub); stroke: var(--faint); stroke-width: 2; transition: stroke .3s, fill .3s; }
  .lock-shackle { fill: none; stroke: var(--faint); stroke-width: 2; transition: stroke .3s; }
  [data-s="ok"] .lock-body { stroke: var(--tls); fill: var(--tls); }
  [data-s="ok"] .lock-shackle { stroke: var(--tls); }
  [data-s="ok"] .lb-tls { fill: var(--tls); }

  /* 数据包 */
  .pkt { fill: var(--pkt); }
  .shell { fill: none; stroke: var(--tunnel); stroke-width: 2; opacity: 0; }
  .glow { fill: var(--pkt); opacity: .25; }
  .cross { stroke: var(--bad); stroke-width: 2.5; stroke-linecap: round; opacity: 0; }

  .sum { margin: 4px 0 0; font-size: 13px; min-height: 20px; }
  .sum.ok { color: var(--ok); } .sum.bad { color: var(--bad); }
  @media (prefers-reduced-motion: reduce) { .cipher { animation: none !important; } }
</style>
</head>
<body>
<div class="bar">
  <h1>请求链路动画 · 设计稿</h1>
  <button onclick="toggleTheme()">切换深色 / 浅色</button>
</div>

<div class="card">
  <h2>连接成功</h2>
  <p>目标 Google，每 3 秒随真实探测数据播放一次，数值为实测</p>
  <div class="flow" data-scenario="ok"></div>
  <div class="sum"></div>
</div>

<div class="card">
  <h2>在 L3 失败</h2>
  <p>代理服务器禁止 TCP 转发时的样子</p>
  <div class="flow" data-scenario="bad"></div>
  <div class="sum"></div>
</div>

<template id="tpl">
<svg viewBox="0 0 760 230">
  <!-- L4 TLS：端到端，跨越整条路线 -->
  <g class="l4" data-s="wait">
    <path class="arc-bg" d="M40 132 C 48 30, 702 30, 710 132" />
    <path class="arc" d="M40 132 C 48 30, 702 30, 710 132" pathLength="1" />
    <g class="lock" transform="translate(375 44)">
      <path class="lock-shackle" d="M-6 0 V-6 a6 6 0 0 1 12 0 V-2" />
      <rect class="lock-body" x="-9" y="0" width="18" height="14" rx="3" />
    </g>
    <text class="lb lb-tls" x="375" y="92">L4 TLS 握手 <tspan class="ms">–</tspan></text>
  </g>

  <!-- L1 SOCKS5 -->
  <g class="l1" data-s="wait">
    <line class="seg" x1="40" y1="140" x2="170" y2="140" />
    <text class="lb" x="105" y="124">L1 SOCKS5 <tspan class="ms">–</tspan></text>
  </g>

  <!-- L2 SSH 隧道 -->
  <g class="l2" data-s="wait">
    <rect class="tube" x="186" y="126" width="358" height="28" rx="14" />
    <line class="sheen" x1="200" y1="130.5" x2="530" y2="130.5" />
    <line class="cipher" x1="200" y1="140" x2="530" y2="140" />
    <text class="lb" x="365" y="116">L2 SSH 加密隧道 <tspan class="ms">–</tspan></text>
  </g>

  <!-- L3 TCP -->
  <g class="l3" data-s="wait">
    <line class="tcp" x1="560" y1="140" x2="710" y2="140" />
    <text class="lb" x="635" y="124">L3 TCP <tspan class="ms">–</tspan></text>
    <text class="flag" x="635" y="164">SYN</text>
    <path class="cross" d="M690 132 l12 12 M702 132 l-12 12" />
  </g>

  <!-- 站点 -->
  <g class="stations">
    <g><circle class="ripple" cx="40" cy="140" r="9" /><circle class="node" cx="40" cy="140" r="8" />
      <text class="st-name" x="40" y="190">应用</text><text class="st-addr" x="40" y="206">本机</text></g>
    <g><circle class="ripple" cx="170" cy="140" r="9" /><circle class="node" cx="170" cy="140" r="8" />
      <text class="st-name" x="170" y="190">本地端口</text><text class="st-addr" x="170" y="206">127.0.0.1:17870</text></g>
    <g><circle class="ripple" cx="560" cy="140" r="9" /><circle class="node" cx="560" cy="140" r="8" />
      <text class="st-name" x="560" y="190">代理服务器</text><text class="st-addr" x="560" y="206">203.0.113.10</text></g>
    <g><circle class="ripple" cx="710" cy="140" r="9" /><circle class="node" cx="710" cy="140" r="8" />
      <text class="st-name" x="710" y="190">目标站点</text><text class="st-addr" x="710" y="206">www.google.com:443</text></g>
  </g>

  <!-- 数据包 -->
  <g class="packet" style="opacity:0">
    <circle class="glow" r="11" />
    <circle class="shell" r="9" />
    <circle class="pkt" r="5" />
  </g>
</svg>
</template>

<script>
const SCENARIOS = {
  ok: { times: [3, 163, 72, 582], fail: -1 },
  bad: { times: [2, 168, null, null], fail: 2, error: '在 L3 被拒绝：代理服务器禁止 TCP 转发（AllowTcpForwarding no）' },
};
const X = [40, 170, 560, 710];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const scale = (ms) => (reduce ? 1 : Math.min(Math.max(ms * 1.4, 280), 900));

function toggleTheme() {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
}

// 数据包从 a 移到 b
function move(pkt, a, b, dur, y = 140) {
  return pkt.animate([{ transform: `translate(${a}px, ${y}px)` }, { transform: `translate(${b}px, ${y}px)` }], { duration: dur, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' }).finished;
}
function ripple(svg, i) {
  const r = svg.querySelectorAll('.ripple')[i];
  r.animate([{ opacity: .9, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(2.6)' }], { duration: 650, easing: 'ease-out' });
  svg.querySelectorAll('.node')[i].style.stroke = 'var(--ok)';
}
function setLayer(svg, n, state, ms) {
  const g = svg.querySelector(`.l${n}`);
  g.dataset.s = state;
  if (ms !== undefined) g.querySelector('.ms').textContent = ms;
}

async function play(card) {
  const svg = card.querySelector('svg');
  const sc = SCENARIOS[card.querySelector('.flow').dataset.scenario];
  const sum = card.querySelector('.sum');
  const pkt = svg.querySelector('.packet'), shell = svg.querySelector('.shell'), flag = svg.querySelector('.flag');
  for (;;) {
    // 复位
    [1, 2, 3, 4].forEach((n) => setLayer(svg, n, 'wait', '–'));
    svg.querySelectorAll('.node').forEach((n) => (n.style.stroke = ''));
    svg.querySelectorAll('.arc, .cross, .lock-shackle, .packet, .shell').forEach((e) => e.getAnimations().forEach((a) => a.cancel()));
    pkt.style.transform = `translate(${X[0]}px, 140px)`;
    sum.textContent = ''; sum.className = 'sum';
    shell.style.opacity = 0;
    pkt.style.opacity = 1;
    await wait(300);

    // L1：应用 → 本地端口
    setLayer(svg, 1, 'run');
    await move(pkt, X[0], X[1], scale(sc.times[0]));
    ripple(svg, 1);
    setLayer(svg, 1, 'ok', `${sc.times[0]}ms`);

    // L2：进入隧道，包上加密壳
    setLayer(svg, 2, 'run');
    shell.animate([{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 220, fill: 'forwards' });
    await move(pkt, X[1], X[2], scale(sc.times[1]));
    shell.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
    ripple(svg, 2);
    setLayer(svg, 2, 'ok', `≈${sc.times[1]}ms`);

    // L3：三次握手
    setLayer(svg, 3, 'run');
    const hops = [['SYN', X[2], X[3]], ['SYN-ACK', X[3], X[2]], ['ACK', X[2], X[3]]];
    let failed = false;
    for (const [name, a, b] of hops) {
      flag.textContent = name;
      flag.animate([{ opacity: 0 }, { opacity: 1, offset: .2 }, { opacity: 1, offset: .8 }, { opacity: 0 }], { duration: 420 });
      if (sc.fail === 2) {
        await move(pkt, a, b - 26, 420);
        failed = true;
        break;
      }
      await move(pkt, a, b, 300);
    }
    if (failed) {
      setLayer(svg, 3, 'bad', '被拒绝');
      svg.querySelector('.cross').animate([{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 260, fill: 'forwards' });
      pkt.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' });
      setLayer(svg, 4, 'skip', '未执行');
      sum.textContent = `✕ ${sc.error}`; sum.className = 'sum bad';
      await wait(3200);
      continue;
    }
    ripple(svg, 3);
    setLayer(svg, 3, 'ok', `≈${sc.times[2]}ms`);

    // L4：TLS 拱桥从应用一路亮到目标，锁扣合上
    pkt.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
    setLayer(svg, 4, 'run');
    await svg.querySelector('.arc').animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: scale(sc.times[3]), easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' }).finished;
    await svg.querySelector('.lock-shackle').animate([{ transform: 'translateY(-4px)' }, { transform: 'translateY(0)' }], { duration: 220, easing: 'ease-in', fill: 'forwards' }).finished;
    setLayer(svg, 4, 'ok', `${sc.times[3]}ms`);
    const total = sc.times.reduce((a, b) => a + b, 0);
    sum.textContent = `✓ 已建立加密连接，总耗时 ${total} ms`; sum.className = 'sum ok';
    await wait(2400);
  }
}

const tpl = document.getElementById('tpl');
document.querySelectorAll('.card').forEach((card) => {
  card.querySelector('.flow').appendChild(tpl.content.cloneNode(true));
  play(card);
});
</script>
</body>
</html>
