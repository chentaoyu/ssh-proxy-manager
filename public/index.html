<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SSH 代理管理</title>
<script>
  document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
</script>
<style>
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --panel: #171a21; --line: #262a33; --text: #e6e8ec; --muted: #8a909c;
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6; --amber: #f59e0b;
    --btn: #1f232c; --line-hover: #3a404c; --input: #0f1115; --sunken: #0b0d10; --sub: #12151b;
    --text2: #c3c2b7; --code: #b6bcc8; --faint: #5b6170; --hover: #1a1e26; --active: #1c2230; --active-line: #2f3b55;
    --switch-off: #2d323d; --dot-off: #4b5160; --grid: #262a33; --cross: #5b6170;
    --c-t0: #3987e5; --c-t1: #d95926; --c-t2: #199e70; --c-rtt: #c98500; --c-retx: #d55181; --c-loss: #9085e9;
    --lv-info: #8a909c; --lv-ssh: #3987e5; --lv-warn: #fab219; --lv-error: #e66767;
    --pkt: #5b9cff; --tunnel: #2dd4bf; --tunnel-fill: rgba(45, 212, 191, .07); --tls: #f5b947; --sheen: rgba(255, 255, 255, .18);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f4f5f7; --panel: #ffffff; --line: #e3e5e9; --text: #16181d; --muted: #6b7280;
    --green: #16a34a; --red: #dc2626; --blue: #2563eb; --amber: #b45309;
    --btn: #f3f4f6; --line-hover: #c7cbd2; --input: #ffffff; --sunken: #f7f8fa; --sub: #fcfcfb;
    --text2: #52514e; --code: #3b4250; --faint: #9aa0aa; --hover: #f0f2f5; --active: #e8f0fe; --active-line: #b9d0f7;
    --switch-off: #d1d5db; --dot-off: #c4c8cf; --grid: #e8e9ec; --cross: #9aa0aa;
    --c-t0: #2a78d6; --c-t1: #eb6834; --c-t2: #1baf7a; --c-rtt: #eda100; --c-retx: #e87ba4; --c-loss: #6250d6;
    --lv-info: #6b7280; --lv-ssh: #2a78d6; --lv-warn: #a16207; --lv-error: #d03b3b;
    --pkt: #2563eb; --tunnel: #0d9488; --tunnel-fill: rgba(13, 148, 136, .07); --tls: #b7791f; --sheen: rgba(255, 255, 255, .9);
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; }
  header { flex-wrap: wrap; gap: 12px; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 1fr; }
  #list { border-right: 1px solid var(--line); overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .item:hover { background: var(--hover); }
  .item.active { background: var(--active); border-color: var(--active-line); }
  .item .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { font-size: 11px; }
  .item .switch { transform: scale(.8); }
  #detail { overflow: auto; padding: 18px 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
  .mon, .mon-grid > * { min-width: 0; }
  .name.big { font-size: 17px; }
  .info { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; }
  .info > div { background: var(--sub); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .info .k { font-size: 12px; color: var(--muted); }
  .info .v { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; }
  .mon { display: grid; gap: 14px; }
  .mon-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .mon-bar input { flex: 1 1 260px; min-width: 0; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #list { max-height: 32vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
  button { white-space: nowrap; cursor: pointer; border: 1px solid var(--line); background: var(--btn); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  button:hover { border-color: var(--line-hover); }
  button.primary { color: #fff; }
  button.primary { background: var(--blue); border-color: var(--blue); }
  button.danger:hover { color: var(--red); border-color: var(--red); }
  button:disabled { opacity: .5; cursor: wait; }
  input, textarea { width: 100%; background: var(--input); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 7px 10px; font: inherit; }
  textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12px; min-height: 90px; }
  input:focus, textarea:focus { outline: none; border-color: var(--blue); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card.on { border-color: rgba(34,197,94,.45); }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 15px; }
  .meta { overflow-wrap: anywhere; color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 12px; margin-top: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot-off); flex: none; }
  .on .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .tag.ext { color: var(--amber); border-color: rgba(245,158,11,.4); }
  .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .actions input { width: 220px; max-width: 100%; }
  .row.wrap { flex-wrap: wrap; }
  @media (max-width: 600px) { header { padding: 16px; } h1 small { display: block; margin: 2px 0 0; } .grid { grid-template-columns: 1fr; } }
  .msg { font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  .msg.err { color: var(--red); } .msg.ok { color: var(--green); }
  pre.logs { display: none; margin: 12px 0 0; background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 220px; overflow: auto; font-size: 12px; color: var(--code); white-space: pre-wrap; }
  pre.logs.show { display: block; }

  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { display: none; }
  .switch span { position: absolute; inset: 0; background: var(--switch-off); border-radius: 24px; transition: .2s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--green); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .switch.busy span { opacity: .5; cursor: wait; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .list-empty { color: var(--muted); font-size: 13px; padding: 14px 12px; }
  .empty-state { max-width: 560px; margin: 40px auto 0; padding: 32px 36px; }
  .empty-state svg { width: 240px; display: block; margin-bottom: 18px; }
  .empty-state .es-seg { stroke: var(--line); stroke-width: 2; }
  .empty-state .es-tube { fill: var(--tunnel-fill); stroke: var(--tunnel); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .empty-state .es-node { fill: var(--sub); stroke: var(--dot-off); stroke-width: 2; }
  .empty-state h2 { font-size: 18px; margin: 0 0 6px; }
  .empty-state p { color: var(--muted); margin: 0 0 16px; line-height: 1.7; }
  .empty-state ol { margin: 0 0 22px; padding-left: 20px; line-height: 2; }
  .empty-state code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
  .empty-state button { padding: 8px 18px; font-size: 14px; }
  #dlg { max-height: 92vh; overflow: auto; width: min(640px, 94vw); }
  .sec { font-size: 12px; font-weight: 600; color: var(--text2); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 6px; }
  select { width: 100%; background: var(--input); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 7px 8px; font: inherit; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 92vw); padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 16px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .check { display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 13px; }
  .check input { width: auto; }
  .preview { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); background: var(--sunken); padding: 8px 10px; border-radius: 6px; word-break: break-all; }
  /* 监控面板 */
  .live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: blink 1.5s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .tile { background: var(--sub); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .tile .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tile .k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: 1px; }
  .badge { white-space: nowrap; flex: none; display: inline-flex; gap: 4px; align-items: center; font-size: 11px; color: var(--text); }
  .badge b { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chart { background: var(--sub); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; position: relative; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .chart-title { font-size: 13px; font-weight: 600; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text2); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart svg text { font-size: 11px; fill: var(--muted); font-family: -apple-system, sans-serif; }
  .chart svg .dl { fill: var(--text2); }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line-hover); box-shadow: 0 4px 14px rgba(0,0,0,.18); border-radius: 6px; padding: 7px 9px; font-size: 12px; display: none; z-index: 3; min-width: 150px; font-variant-numeric: tabular-nums; }
  .tip div { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
  .tip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tip .t { color: var(--muted); margin-bottom: 3px; }
  .tip .e { color: var(--text); margin-top: 3px; }
  .mon-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 860px) { .mon-grid { grid-template-columns: minmax(0, 1fr); } }
  .logbox { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; height: 260px; overflow: auto; font: 12px/1.6 ui-monospace, Menlo, monospace; padding: 8px 10px; }
  .logbox .l { display: flex; gap: 8px; white-space: pre-wrap; word-break: break-all; color: var(--code); }
  .logbox .l time { color: var(--faint); flex: none; }
  .logbox .lv { flex: none; width: 52px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  table.data th { color: var(--muted); font-weight: 500; }
  table.data td:first-child, table.data th:first-child { text-align: left; }
  .tablewrap { max-height: 260px; overflow: auto; display: none; }
  .tablewrap.show { display: block; }
  /* 请求链路动画：封装剖面 */
  #flow .fhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  #flow .fmeta { font-size: 12px; color: var(--muted); }
  #flow svg { display: block; width: 100%; height: auto; overflow: visible; }
  #flow .seg { stroke: var(--line); stroke-width: 2; transition: stroke .3s; }
  #flow .node { fill: var(--sub); stroke: var(--dot-off); stroke-width: 2; transition: stroke .3s; }
  #flow .node.done { stroke: var(--green); }
  #flow .ripple { fill: none; stroke: var(--green); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
  #flow .st-name { font-size: 12.5px; font-weight: 600; fill: var(--text); }
  #flow .st-addr { font-size: 11px; fill: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  #flow .lb { font-size: 11.5px; fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; transition: fill .3s; }
  #flow .lb .ms { font-weight: 600; }
  #flow [data-s="ok"] .lb { fill: var(--text); }
  #flow [data-s="bad"] .lb { fill: var(--red); }
  #flow [data-s="skip"] { opacity: .35; }
  #flow [data-s="ok"] .seg, #flow [data-s="ok"] .tcp { stroke: var(--green); }
  #flow [data-s="bad"] .seg, #flow [data-s="bad"] .tcp { stroke: var(--red); stroke-dasharray: 4 4; }
  #flow .tube { fill: var(--tunnel-fill); stroke: var(--tunnel); stroke-width: 1.5; stroke-opacity: .35; transition: stroke-opacity .4s; }
  #flow [data-s="run"] .tube, #flow [data-s="ok"] .tube { stroke-opacity: 1; }
  #flow .sheen { stroke: var(--sheen); stroke-width: 1.5; stroke-linecap: round; }
  #flow .cipher { stroke: var(--tunnel); stroke-width: 1.5; stroke-dasharray: 2 9; opacity: 0; transition: opacity .4s; }
  #flow [data-s="run"] .cipher, #flow [data-s="ok"] .cipher { opacity: .5; animation: cipher-flow 1.2s linear infinite; }
  @keyframes cipher-flow { to { stroke-dashoffset: -22; } }
  #flow .tcp { stroke: var(--line); stroke-width: 2; transition: stroke .3s; }
  #flow .flag { font-size: 10.5px; font-weight: 600; fill: var(--pkt); text-anchor: middle; opacity: 0; }
  #flow .arc-bg { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 5; }
  #flow .arc { fill: none; stroke: var(--tls); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  #flow [data-s="bad"] .arc { stroke: var(--red); }
  #flow .lock-body { fill: var(--sub); stroke: var(--dot-off); stroke-width: 2; transition: stroke .3s, fill .3s; }
  #flow .lock-shackle { fill: none; stroke: var(--dot-off); stroke-width: 2; transform: translateY(-4px); transition: stroke .3s; }
  #flow [data-s="ok"] .lock-body { stroke: var(--tls); fill: var(--tls); }
  #flow [data-s="ok"] .lock-shackle { stroke: var(--tls); }
  #flow [data-s="ok"] .lb-tls { fill: var(--tls); }
  #flow [data-s="bad"] .lock-body, #flow [data-s="bad"] .lock-shackle { stroke: var(--red); }
  #flow .pkt { fill: var(--pkt); }
  #flow .glow { fill: var(--pkt); opacity: .25; }
  #flow .shell { fill: none; stroke: var(--tunnel); stroke-width: 2; opacity: 0; }
  #flow .cross { stroke: var(--red); stroke-width: 2.5; stroke-linecap: round; opacity: 0; transform-box: fill-box; transform-origin: center; }
  #flow .fsum { font-size: 13px; margin-top: 2px; min-height: 20px; }
  #flow .fsum.ok { color: var(--green); }
  #flow .fsum.bad { color: var(--red); }
  @media (prefers-reduced-motion: reduce) { #flow .cipher { animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1>SSH 代理管理<small>本地 SOCKS5 · ssh -D</small></h1>
  <div class="row">
    <button id="themeBtn" onclick="toggleTheme()"></button>
    <button onclick="refresh()">刷新</button>
    <button class="primary" onclick="openForm()">+ 新增代理</button>
  </div>
</header>
<div class="layout">
  <aside id="list"></aside>
  <section id="detail">
    <div id="detailHead"></div>
    <div class="card empty" id="monIdle" style="padding:40px 0">代理未运行，启动后自动开始实时监控</div>
    <div class="mon" id="mon">
      <div class="mon-bar">
        <span class="chart-title">实时监控</span>
        <span class="live"><i></i>每 3 秒采样 · <span id="monWin"></span></span>
        <span class="grow"></span>
        <label class="check" style="margin:0">TLS 探测目标</label>
        <input id="monTarget" placeholder="多个用逗号分隔，最多 3 个" onkeydown="if(event.key==='Enter')setTarget()" />
        <button onclick="setTarget()">应用</button>
        <button onclick="toggleTable()">数据表</button>
      </div>
      <div class="chart" id="flow"></div>
      <div class="tiles" id="tiles"></div>
      <div class="mon-grid">
        <div class="chart" id="chartLat"></div>
        <div class="chart" id="chartLoss"></div>
      </div>
      <div class="tablewrap" id="tableWrap"></div>
      <div>
        <div class="chart-head"><span class="chart-title">实时日志</span><label class="check"><input type="checkbox" id="autoScroll" checked /> 自动滚动</label></div>
        <div class="logbox" id="monLogs"></div>
      </div>
    </div>
  </section>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">新增代理</h2>
    <div class="grid">
      <div class="sec full">基本</div>
      <div class="full"><label>名称</label><input name="name" placeholder="可选，默认用主机名" /></div>
      <div><label>用户</label><input name="user" value="root" required /></div>
      <div><label>主机</label><input name="host" placeholder="1.2.3.4" required /></div>
      <div><label>SSH 端口 (-p)</label><input name="sshPort" type="number" value="22" required /></div>
      <div><label>本地 SOCKS 端口 (-D)</label><input name="localPort" type="number" required /></div>
      <div class="full"><label>监听地址（Docker 中保持 0.0.0.0，宿主机只映射到 127.0.0.1，仅本机可访问）</label><input name="bind" value="0.0.0.0" /></div>

      <div class="sec full">认证</div>
      <div class="full"><label>密码（编辑时留空则保留原密码；不填则走密钥登录）</label><input name="password" type="password" autocomplete="new-password" /></div>
      <div class="full row">
        <label class="check"><input type="checkbox" name="remember" /> 保存密码到本地 proxies.json</label>
        <label class="check" id="clearWrap"><input type="checkbox" name="clearPassword" /> 清除已保存密码</label>
      </div>
      <div class="full" id="optIdentity"></div>

      <div class="sec full">跳板机（可选，留空则直连）</div>
      <div><label>跳板机主机</label><input name="jumpHost" placeholder="如 bastion.example.com" /></div>
      <div><label>跳板机端口</label><input name="jumpPort" type="number" placeholder="22" /></div>
      <div><label>跳板机用户</label><input name="jumpUser" placeholder="默认同目标用户" /></div>
      <div><label>跳板机私钥</label><input name="jumpIdentityFile" placeholder="~/.ssh/id_ed25519" /></div>
      <div class="full"><label>跳板机密码（编辑时留空则保留原密码）</label><input name="jumpPassword" type="password" autocomplete="new-password" /></div>

      <div class="sec full">加密 DNS（DoH，可选）</div>
      <div><label>DNS 端口 (UDP)</label><input name="dnsPort" type="number" placeholder="留空关闭，可与 SOCKS 端口相同" /></div>
      <div><label>上游 DoH</label><input name="dnsUpstream" list="dohList" placeholder="https://cloudflare-dns.com/dns-query" /></div>
      <datalist id="dohList">
        <option value="https://cloudflare-dns.com/dns-query">Cloudflare</option>
        <option value="https://dns.google/dns-query">Google</option>
        <option value="https://dns.quad9.net/dns-query">Quad9</option>
      </datalist>

      <div class="sec full">连接参数 (-o)</div>
      <div class="full grid" id="optFields"></div>
      <div class="full"><label>其他 -o 选项（每行一个 Key=Value）</label><textarea name="options" placeholder="Ciphers=aes128-gcm@openssh.com"></textarea></div>
      <div class="full"><label>额外命令行参数</label><input name="extraArgs" placeholder="如 -4 -v -J jump@host" /></div>
      <div class="full"><div class="preview" id="preview"></div></div>
    </div>
    <div class="actions" style="justify-content:flex-end;margin-top:18px">
      <button type="button" onclick="dlg.close()">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>


<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let state = { list: [], defaults: [] };
let editing = null;

async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error);
  return data;
}

async function refresh() {
  state = await api('/api/proxies');
  render();
}

function cmdOf(p) {
  const jump = p.jumpHost
    ? ` -o "ProxyCommand=ssh -W %h:%p -p ${p.jumpPort || 22} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10${p.jumpIdentityFile ? ` -i ${p.jumpIdentityFile}` : ''} ${p.jumpUser || p.user}@${p.jumpHost}"`
    : '';
  return `ssh -N -D ${p.bind}:${p.localPort} -p ${p.sshPort} ${p.options.map((o) => `-o ${o}`).join(' ')}${jump} ${p.extraArgs ? p.extraArgs + ' ' : ''}${p.user}@${p.host}`;
}

let selected = localStorage.getItem('selected');
const msgs = {};
const cur = () => state.list.find((x) => x.id === selected);

function select(id) {
  selected = id;
  localStorage.setItem('selected', id);
  render();
}

function render() {
  if (!cur()) selected = state.list[0]?.id;
  $('#list').innerHTML = state.list.length
    ? state.list.map((p) => `
      <div class="item ${p.status.running ? 'on' : ''} ${p.id === selected ? 'active' : ''}" onclick="select('${p.id}')">
        <div class="dot"></div>
        <div class="grow">
          <div class="name">${esc(p.name)}</div>
          <div class="meta">${addr(p)}:${p.localPort}${p.dnsPort ? ` · DNS ${p.dnsPort}` : ''}</div>
        </div>
        <label class="switch" onclick="event.stopPropagation()"><input type="checkbox" ${p.status.running || p.enabled ? 'checked' : ''} onchange="toggle('${p.id}', this)"><span></span></label>
      </div>`).join('')
    : '<div class="list-empty">暂无代理</div>';
  renderDetail();
}

function renderDetail() {
  const p = cur();
  syncMonitor();
  if (!p) return ($('#detailHead').innerHTML = EMPTY_STATE);
  const s = p.status;
  const tag = s.running
    ? s.managed ? '<span class="tag">面板启动</span>' : `<span class="tag ext">外部进程 ${esc(s.cmd)}</span>`
    : p.enabled ? '<span class="tag ext">自动重连中</span>' : '<span class="tag">未运行</span>';
  const m = msgs[p.id] || {};
  $('#detailHead').innerHTML = `
    <div class="card ${s.running ? 'on' : ''}">
      <div class="row">
        <div class="dot"></div>
        <div class="grow">
          <div class="row wrap" style="gap:6px"><span class="name big">${esc(p.name)}</span>${tag}${p.hasPassword ? '<span class="tag">已存密码</span>' : ''}${p.jumpHost ? `<span class="tag">经跳板机${p.hasJumpPassword ? ' · 已存密码' : ''}</span>` : ''}</div>
          <div class="meta">socks5://${addr(p)}:${p.localPort} → ${esc(p.user)}@${esc(p.host)}:${p.sshPort}</div>
        </div>
        <label class="switch"><input type="checkbox" ${s.running || p.enabled ? 'checked' : ''} onchange="toggle('${p.id}', this)"><span></span></label>
      </div>
      <div class="info">
        <div><div class="k">本地 SOCKS5</div><div class="v">${addr(p)}:${p.localPort}</div></div>
        <div><div class="k">远端</div><div class="v">${esc(p.user)}@${esc(p.host)}</div></div>
        <div><div class="k">SSH 端口</div><div class="v">${p.sshPort}</div></div>
        <div><div class="k">跳板机</div><div class="v">${p.jumpHost ? `${esc(p.jumpUser || p.user)}@${esc(p.jumpHost)}:${p.jumpPort || 22}` : '直连'}</div></div>
        <div><div class="k">进程</div><div class="v">${s.running ? `${esc(s.cmd)} · pid ${s.pids.join(',')}` : '–'}</div></div>
        <div><div class="k">加密 DNS</div><div class="v">${!p.dnsPort ? '未开启' : `udp://${addr(p)}:${p.dnsPort}`}</div>${p.dns ? `<div class="k">${p.dns.queries} 次查询 · 缓存 ${p.dns.cached} · 失败 ${p.dns.failed} · 平均 ${p.dns.avgMs ?? '–'}ms</div>` : ''}</div>
      </div>
      <div class="preview" style="margin-top:10px">${esc(cmdOf(p))}</div>
      <div class="actions">
        ${!s.running && needPwd(p) ? `
          ${!p.hasPassword ? `<input type="password" class="pwd" placeholder="目标机密码（密钥登录可留空）" onkeydown="if(event.key==='Enter')toggle('${p.id}')" />` : ''}
          ${p.jumpHost && !p.hasJumpPassword ? `<input type="password" class="pwd jump" placeholder="跳板机密码（密钥登录可留空）" onkeydown="if(event.key==='Enter')toggle('${p.id}')" />` : ''}
          <label class="check"><input type="checkbox" class="remember" checked /> 记住密码</label><button class="primary" onclick="toggle('${p.id}')">连接</button>` : ''}
        <button onclick="testProxy('${p.id}', this)" ${s.running ? '' : 'disabled'}>测试</button>
        <button onclick="openForm('${p.id}')">编辑</button>
        <button class="danger" onclick="removeProxy('${p.id}')">删除</button>
        <span class="msg ${m.cls || ''}">${esc(m.text)}</span>
      </div>
    </div>`;
}

// 容器内监听 0.0.0.0，宿主机侧只映射到 127.0.0.1
const addr = (p) => (['0.0.0.0', '::'].includes(p.bind) ? '127.0.0.1' : esc(p.bind));
// 新增代理时默认取 17870 起第一个未占用的端口（Docker 映射范围 17870-17879）
const nextPort = () => {
  const used = new Set(state.list.flatMap((p) => [p.localPort, p.dnsPort]));
  for (let port = 17870; port <= 17879; port++) if (!used.has(port)) return port;
  return '';
};

const EMPTY_STATE = `
  <div class="card empty-state">
    <svg viewBox="0 0 320 64" aria-hidden="true">
      <line x1="24" y1="32" x2="76" y2="32" class="es-seg"/>
      <rect x="92" y="18" width="136" height="28" rx="14" class="es-tube"/>
      <line x1="244" y1="32" x2="296" y2="32" class="es-seg"/>
      <circle cx="24" cy="32" r="7" class="es-node"/><circle cx="84" cy="32" r="7" class="es-node"/>
      <circle cx="236" cy="32" r="7" class="es-node"/><circle cx="296" cy="32" r="7" class="es-node"/>
    </svg>
    <h2>还没有代理</h2>
    <p>添加一台能用 SSH 登录的服务器，就能在本机得到一个 SOCKS5 代理，流量经加密隧道从服务器出去。</p>
    <ol>
      <li>填写服务器地址、SSH 端口和用户名</li>
      <li>输入 SSH 密码，打开开关连接</li>
      <li>在浏览器或其他软件里把代理设为 <code>socks5://127.0.0.1:17870</code></li>
    </ol>
    <button class="primary" onclick="openForm()">新增代理</button>
  </div>`;

const needPwd = (p) => !p.hasPassword || (p.jumpHost && !p.hasJumpPassword);

function setMsg(id, text, cls = '') {
  msgs[id] = { text, cls };
  if (id === selected) renderDetail();
}

async function toggle(id, input) {
  const p = state.list.find((x) => x.id === id);
  const wantOn = input ? input.checked : true;
  const pwd = id === selected ? $('#detailHead .pwd:not(.jump)')?.value : '';
  const jumpPwd = id === selected ? $('#detailHead .pwd.jump')?.value : '';
  // 列表里直接打开但未存密码：切到详情输入密码
  if (wantOn && needPwd(p) && id !== selected) {
    select(id);
    setMsg(id, '请输入密码后点击连接（密钥登录可直接点连接）');
    return $('#detailHead .pwd')?.focus();
  }
  if (input) input.parentElement.classList.add('busy');
  setMsg(id, wantOn ? '连接中…' : '停止中…');
  try {
    if (wantOn) await api(`/api/proxies/${id}/start`, 'POST', { password: pwd, jumpPassword: jumpPwd, remember: $('#detailHead .remember')?.checked });
    else await api(`/api/proxies/${id}/stop`, 'POST');
    msgs[id] = { text: wantOn ? '已启动' : '已停止', cls: 'ok' };
  } catch (e) {
    msgs[id] = { text: e.message, cls: 'err' };
  }
  await refresh();
}

async function testProxy(id, btn) {
  btn.disabled = true;
  setMsg(id, '测试中…');
  const r = await api(`/api/proxies/${id}/test`, 'POST');
  setMsg(id, r.ok ? `出口 IP ${r.ip} · ${r.ms}ms` : `失败：${r.error}`, r.ok ? 'ok' : 'err');
}

async function removeProxy(id) {
  const p = state.list.find((x) => x.id === id);
  if (!confirm(`删除代理「${p.name}」？运行中的连接会被停止。`)) return;
  await api(`/api/proxies/${id}`, 'DELETE');
  await refresh();
}

const form = $('#form');
const dlg = $('#dlg');
// 常用 -o 参数做成独立表单项，值为空表示不传（使用 ssh 默认）
const SSH_OPTS = [
  { key: 'ServerAliveInterval', label: '心跳间隔 (秒)', type: 'number', def: '30' },
  { key: 'ServerAliveCountMax', label: '心跳失败次数上限', type: 'number', def: '3' },
  { key: 'ConnectTimeout', label: '连接超时 (秒)', type: 'number' },
  { key: 'StrictHostKeyChecking', label: '主机密钥校验', opts: ['accept-new', 'yes', 'no'], def: 'accept-new' },
  { key: 'ExitOnForwardFailure', label: '端口转发失败时退出', opts: ['yes', 'no'], def: 'yes' },
  { key: 'TCPKeepAlive', label: 'TCPKeepAlive', opts: ['yes', 'no'] },
  { key: 'Compression', label: '压缩传输', opts: ['yes', 'no'] },
  { key: 'IdentityFile', label: '私钥路径 (IdentityFile)', placeholder: '~/.ssh/id_ed25519', full: true },
];
const optInput = (o) => {
  const f = o.opts
    ? `<select name="o_${o.key}"><option value="">默认</option>${o.opts.map((v) => `<option>${v}</option>`).join('')}</select>`
    : `<input name="o_${o.key}" type="${o.type || 'text'}" placeholder="${o.placeholder || '默认'}" />`;
  return `<div class="${o.full ? 'full' : ''}"><label>${o.label}</label>${f}</div>`;
};
$('#optFields').innerHTML = SSH_OPTS.filter((o) => o.key !== 'IdentityFile').map(optInput).join('');
$('#optIdentity').innerHTML = optInput(SSH_OPTS.find((o) => o.key === 'IdentityFile'));

function openForm(id) {
  editing = state.list.find((x) => x.id === id) || null;
  const p = editing || { user: 'root', sshPort: 22, bind: state.defaultBind || '127.0.0.1', localPort: nextPort(), extraArgs: '', options: SSH_OPTS.filter((o) => o.def).map((o) => `${o.key}=${o.def}`) };
  $('#dlgTitle').textContent = editing ? '编辑代理' : '新增代理';
  for (const k of ['name', 'user', 'host', 'sshPort', 'localPort', 'bind', 'extraArgs', 'jumpHost', 'jumpUser', 'jumpPort', 'jumpIdentityFile', 'dnsUpstream']) form[k].value = p[k] ?? '';
  form.dnsPort.value = p.dnsPort || '';
  form.jumpPassword.value = '';
  // 拆分已知参数与其他参数
  const known = {}, rest = [];
  for (const o of p.options) {
    const [k, ...v] = o.split(/[=\s]/);
    SSH_OPTS.some((x) => x.key === k) ? (known[k] = v.join('=')) : rest.push(o);
  }
  for (const o of SSH_OPTS) form[`o_${o.key}`].value = known[o.key] ?? '';
  form.options.value = rest.join('\n');
  form.password.value = '';
  form.remember.checked = true;
  form.clearPassword.checked = false;
  $('#clearWrap').style.display = editing?.hasPassword || editing?.hasJumpPassword ? '' : 'none';
  updatePreview();
  dlg.showModal();
}

function formData() {
  const d = Object.fromEntries(new FormData(form));
  d.options = [
    ...SSH_OPTS.filter((o) => form[`o_${o.key}`].value.trim()).map((o) => `${o.key}=${form[`o_${o.key}`].value.trim()}`),
    ...form.options.value.split('\n').map((s) => s.trim()).filter(Boolean),
  ];
  for (const k of Object.keys(d)) if (k.startsWith('o_')) delete d[k];
  d.remember = form.remember.checked;
  d.clearPassword = form.clearPassword.checked;
  return d;
}
function updatePreview() {
  const d = formData();
  $('#preview').textContent = cmdOf({ ...d, bind: d.bind || '127.0.0.1', localPort: d.localPort || '?', sshPort: d.sshPort || 22 });
}
form.addEventListener('input', updatePreview);
form.addEventListener('change', updatePreview);
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const d = formData();
    if (editing) await api(`/api/proxies/${editing.id}`, 'PUT', d);
    else selected = (await api('/api/proxies', 'POST', d)).id;
    dlg.close();
    await refresh();
  } catch (err) {
    alert(err.message);
  }
});

// ================= 实时监控 =================
const C = { t: ['var(--c-t0)', 'var(--c-t1)', 'var(--c-t2)'], rtt: 'var(--c-rtt)', retx: 'var(--c-retx)', loss: 'var(--c-loss)' };
const NAMES = { google: 'Google', cloudflare: 'Cloudflare', 'docker.io': 'Docker Hub', github: 'GitHub', openai: 'OpenAI' };
const nameOf = (t) => Object.entries(NAMES).find(([k]) => t.includes(k))?.[1] || t.replace(/:443$/, '');
const STATUS = { good: ['#0ca30c', '✓ 良好'], warning: ['#fab219', '! 注意'], critical: ['#d03b3b', '✕ 异常'] };
const LEVEL = { info: ['var(--lv-info)', 'INFO'], ssh: ['var(--lv-ssh)', 'SSH'], warn: ['var(--lv-warn)', '! WARN'], error: ['var(--lv-error)', '✕ ERR'] };
let mon = {};

const fmtMs = (v) => (v == null ? '–' : `${v.toFixed(0)}ms`);
const fmtPct = (v) => (v == null ? '–' : `${v < 1 && v > 0 ? v.toFixed(2) : v.toFixed(1)}%`);
const fmtRate = (v) => (v == null ? '–' : v > 1048576 ? `${(v / 1048576).toFixed(1)}MB/s` : `${(v / 1024).toFixed(1)}KB/s`);
const fmtTime = (t) => new Date(t).toLocaleTimeString('zh-CN', { hour12: false });
const pctl = (arr, q) => {
  const a = arr.filter((v) => v != null).sort((x, y) => x - y);
  return a.length ? a[Math.min(a.length - 1, Math.floor(a.length * q))] : null;
};
const sum = (arr, k) => arr.reduce((a, d) => a + (d[k] || 0), 0);

function openMonitor(id) {
  if (!id || (mon.id === id && mon.es)) return;
  mon.es?.close();
  const p = state.list.find((x) => x.id === id);
  mon = { id, samples: [] };
  $('#monLogs').innerHTML = '';
  for (const el of [$('#chartLat'), $('#chartLoss')]) el._hx = null;
  renderFlow();
  mon.es = new EventSource(`/api/proxies/${id}/monitor`);
  mon.es.addEventListener('init', (e) => {
    const d = JSON.parse(e.data);
    setTargets(d.targets);
    mon.samples = d.samples.map(derive);
    $('#monLogs').innerHTML = '';
    d.logs.forEach(appendLog);
    drawMonitor();
    animateFlow(mon.samples.at(-1));
  });
  mon.es.addEventListener('sample', (e) => {
    mon.samples.push(derive(JSON.parse(e.data)));
    if (mon.samples.length > 200) mon.samples.shift();
    drawMonitor();
    animateFlow(mon.samples.at(-1));
  });
  mon.es.addEventListener('log', (e) => appendLog(JSON.parse(e.data)));
  mon.es.addEventListener('targets', (e) => setTargets(JSON.parse(e.data)));
  drawMonitor();
}

function derive(s) {
  s.lossPct = s.icmpSent ? (s.icmpLost / s.icmpSent) * 100 : null;
  for (const p of s.probes || []) s[`tls:${p.target}`] = p.tlsMs ?? null;
  return s;
}

function setTargets(targets) {
  mon.targets = targets;
  $('#monTarget').value = targets.join(', ');
}

async function setTarget() {
  const targets = $('#monTarget').value.split(/[,，\s]+/).filter(Boolean);
  if (targets.length) setTargets((await api(`/api/proxies/${mon.id}/monitor-targets`, 'POST', { targets })).targets);
}

function appendLog(l) {
  const box = $('#monLogs');
  const [color, label] = LEVEL[l.level] || LEVEL.info;
  const row = document.createElement('div');
  row.className = 'l';
  row.innerHTML = `<time>${fmtTime(l.time)}</time><span class="lv" style="color:${color}">${label}</span><span>${esc(l.text)}</span>`;
  box.appendChild(row);
  while (box.children.length > 500) box.firstChild.remove();
  if ($('#autoScroll').checked) box.scrollTop = box.scrollHeight;
}

const badge = (level) => level ? `<span class="badge"><b style="background:${STATUS[level][0]}"></b>${STATUS[level][1]}</span>` : '';
const grade = (v, good, warn, higherBetter) =>
  v == null ? null : higherBetter ? (v >= good ? 'good' : v >= warn ? 'warning' : 'critical') : v <= good ? 'good' : v <= warn ? 'warning' : 'critical';

function drawTiles() {
  const d = mon.samples;
  const last = d[d.length - 1] || {};
  const out = sum(d, 'dOut');
  const retx = out > 0 ? (sum(d, 'dRetx') / out) * 100 : null;
  const sent = sum(d, 'icmpSent');
  const loss = sent ? (sum(d, 'icmpLost') / sent) * 100 : null;
  const icmp = d.map((s) => s.icmpRtt).filter((v) => v != null);
  const jitter = icmp.length > 1 ? icmp.slice(1).reduce((a, v, i) => a + Math.abs(v - icmp[i]), 0) / (icmp.length - 1) : null;
  const win = d.length ? `近 ${Math.round((d.length * 3) / 60) || '<1'} 分钟 · ${d.length} 次采样` : '等待数据…';

  $('#monWin').textContent = win;
  const tiles = [
    ...(mon.targets || []).map((t, i) => {
      const rs = d.map((s) => s.probes?.find((p) => p.target === t)).filter(Boolean);
      const fail = rs.filter((p) => !p.ok).length;
      const ok = rs.length ? ((rs.length - fail) / rs.length) * 100 : null;
      const ms = rs.map((p) => p.tlsMs);
      return [
        `<i class="sw" style="background:${C.t[i]}"></i>TLS · ${esc(nameOf(t))}`,
        fmtPct(ok),
        `P50 ${fmtMs(pctl(ms, 0.5))} · P95 ${fmtMs(pctl(ms, 0.95))} · ${fail} 次失败`,
        grade(ok, 99, 95, true),
      ];
    }),
    ['TCP 重传率（隧道）', out ? fmtPct(retx) : '无流量', `重传 ${sum(d, 'dRetx')}B · 乱序/重复 ${sum(d, 'dOoo')}B`, out ? grade(retx, 1, 3) : null],
    ['ICMP 丢包率', fmtPct(loss), `${sum(d, 'icmpLost')} / ${sent} 包`, grade(loss, 1, 5)],
    ['隧道 RTT', fmtMs(last.rtt), `RTT 方差 ${fmtMs(last.rttVar)} · ICMP 抖动 ${fmtMs(jitter)}`, null],
    ['吞吐', `↓ ${fmtRate(last.inBps)}`, `↑ ${fmtRate(last.outBps)}`, null],
  ];
  $('#tiles').innerHTML = tiles
    .map(([k, v, sub, lv]) => `<div class="tile"><div class="row" style="justify-content:space-between;gap:6px"><span class="k">${k}</span>${badge(lv)}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`)
    .join('');
}

function niceMax(v) {
  const e = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((f) => f * e).find((x) => x >= v);
}

function drawChart(el, title, series, { unit, fmt, minMax = 1, fails = false }) {
  const data = mon.samples;
  const sig = series.map((x) => x.label).join('|');
  if (el._sig !== sig) {
    el._sig = sig;
    el.innerHTML = `<div class="chart-head"><span class="chart-title">${title}</span><div class="legend">${series
      .map((s) => `<span><i style="background:${s.color}"></i>${s.label}</span>`)
      .join('')}${fails ? `<span style="color:var(--text2)"><b style="color:${STATUS.critical[0]}">✕</b> TLS 失败</span>` : ''}</div></div><svg></svg><div class="tip"></div>`;
    const svg = $('svg', el);
    svg.onmousemove = (e) => {
      const r = svg.getBoundingClientRect();
      el._hx = e.clientX - r.left;
      hover(el);
    };
    svg.onmouseleave = () => {
      el._hx = null;
      hover(el);
    };
  }
  const svg = $('svg', el);
  const W = svg.clientWidth || 500, H = 200, m = { l: 46, r: 112, t: 12, b: 22 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = data.length;
  const x = (i) => m.l + (n < 2 ? iw : (i / (n - 1)) * iw);
  const vals = data.flatMap((d) => series.map((s) => d[s.key])).filter((v) => v != null && isFinite(v));
  const max = niceMax(Math.max(minMax, ...vals) * 1.1);
  const y = (v) => m.t + ih - (v / max) * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k;
    g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)" stroke-width="1"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  if (n) [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => (g += `<text x="${x(i)}" y="${H - 4}" text-anchor="${['start', 'middle', 'end'][k]}">${fmtTime(data[i].t)}</text>`));

  const labels = [];
  for (const s of series) {
    let d = '', pen = false;
    data.forEach((p, i) => {
      const v = p[s.key];
      if (v == null || !isFinite(v)) return (pen = false);
      d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    g += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    // 孤立点也要可见
    data.forEach((p, i) => {
      const v = p[s.key], pv = data[i - 1]?.[s.key], nv = data[i + 1]?.[s.key];
      if (v != null && pv == null && nv == null) g += `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" style="fill:${s.color}"/>`;
    });
    const li = data.map((p) => p[s.key]).findLastIndex((v) => v != null && isFinite(v));
    if (li >= 0) labels.push({ y: y(data[li][s.key]), text: `${s.short} ${fmt(data[li][s.key])}`, color: s.color });
  }
  // 末端直接标注，避免重叠
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 13);
  for (const l of labels) g += `<rect x="${m.l + iw + 6}" y="${l.y - 4}" width="8" height="2" rx="1" style="fill:${l.color}"/><text class="dl" x="${m.l + iw + 18}" y="${l.y + 4}">${l.text}</text>`;
  if (fails) data.forEach((p, i) => !p.tlsOk && (g += `<text x="${x(i)}" y="${m.t + ih - 3}" text-anchor="middle" style="fill:${STATUS.critical[0]};font-size:12px;font-weight:700">✕</text>`));
  g += `<g class="hv"></g>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('height', H);
  svg.innerHTML = g;
  el._st = { data, series, x, y, m, iw, ih, fmt, W };
  hover(el);
}

function hover(el) {
  const st = el._st, tip = $('.tip', el), hv = $('.hv', el);
  if (!st || !hv) return;
  const { data, series, x, y, m, iw, ih, fmt, W } = st;
  if (el._hx == null || !data.length || el._hx < m.l - 10 || el._hx > m.l + iw + 10) {
    hv.innerHTML = '';
    tip.style.display = 'none';
    return;
  }
  const i = data.length < 2 ? 0 : Math.max(0, Math.min(data.length - 1, Math.round(((el._hx - m.l) / iw) * (data.length - 1))));
  const p = data[i];
  let g = `<line x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${m.t + ih}" style="stroke:var(--cross)" stroke-width="1"/>`;
  for (const s of series) if (p[s.key] != null) g += `<circle cx="${x(i)}" cy="${y(p[s.key])}" r="4" style="fill:${s.color};stroke:var(--sub)" stroke-width="2"/>`;
  hv.innerHTML = g;
  tip.innerHTML =
    `<div class="t">${fmtTime(p.t)}</div>` +
    series.map((s) => `<div><span><i style="background:${s.color}"></i> ${s.label}</span><b>${p[s.key] == null ? '–' : fmt(p[s.key])}</b></div>`).join('') +
    (!p.tlsOk ? `<div class="e">✕ ${esc(p.error)}</div>` : '');
  tip.style.display = 'block';
  const px = x(i) + 12 + tip.offsetWidth > W ? x(i) - tip.offsetWidth - 12 : x(i) + 12;
  tip.style.left = `${px + 12}px`;
  tip.style.top = '44px';
}

function drawTable() {
  const wrap = $('#tableWrap');
  if (!wrap.classList.contains('show')) return;
  const rows = mon.samples.slice(-60).reverse();
  const ts = mon.targets || [];
  wrap.innerHTML = `<table class="data"><tr><th>时间</th>${ts.map((t) => `<th>${esc(nameOf(t))} SOCKS/TLS</th>`).join('')}<th>隧道 RTT</th><th>重传率</th><th>ICMP RTT</th><th>ICMP 丢包</th><th>↓</th><th>↑</th></tr>${rows
    .map((s) => `<tr><td>${fmtTime(s.t)}</td>${ts.map((t) => {
      const p = s.probes?.find((q) => q.target === t);
      return `<td>${!p ? '–' : p.ok ? `${fmtMs(p.socksMs)} / ${fmtMs(p.tlsMs)}` : `✕ ${esc(p.error)}`}</td>`;
    }).join('')}<td>${fmtMs(s.rtt)}</td><td>${fmtPct(s.retxPct)}</td><td>${fmtMs(s.icmpRtt)}</td><td>${s.icmpLost ?? '–'}/${s.icmpSent ?? '–'}</td><td>${fmtRate(s.inBps)}</td><td>${fmtRate(s.outBps)}</td></tr>`)
    .join('')}</table>`;
}
function toggleTable() {
  $('#tableWrap').classList.toggle('show');
  drawTable();
}

function drawMonitor() {
  drawTiles();
  drawChart($('#chartLat'), 'TLS 握手 / 隧道 RTT (ms)', [
    ...(mon.targets || []).map((t, i) => ({ key: `tls:${t}`, label: `TLS · ${nameOf(t)}`, short: nameOf(t), color: C.t[i] })),
    { key: 'rtt', label: '隧道 RTT', short: 'RTT', color: C.rtt },
  ], { fmt: (v) => `${Math.round(v)}`, minMax: 100, fails: true });
  drawChart($('#chartLoss'), '丢包与重传 (%)', [
    { key: 'retxPct', label: 'TCP 重传率', short: '重传', color: C.retx },
    { key: 'lossPct', label: 'ICMP 丢包率', short: '丢包', color: C.loss },
  ], { fmt: (v) => `${+v.toFixed(1)}%`, minMax: 5 });
  drawTable();
}
window.addEventListener('resize', () => mon.id && (drawMonitor(), renderFlow()));

// ================= 请求链路动画（封装剖面） =================
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FY = 140; // 路线高度
const LNAMES = ['L1 SOCKS5', 'L2 SSH 隧道', 'L3 TCP 建连', 'L4 TLS 握手'];
const HINTS = ['本地端口连不上，检查代理是否在运行', '', '代理服务器连不上目标，或禁止了 TCP 转发（检查 AllowTcpForwarding）'];
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const msText = (v, est) => (v == null ? '–' : (est ? '≈' : '') + (v < 1 ? '<1ms' : fmtMs(v)));

function renderFlow() {
  const el = $('#flow');
  const p = cur();
  if (!p || !el) return;
  const W = Math.max(el.clientWidth - 24, 340);
  const narrow = W < 600;
  const x0 = 34, x3 = W - 34;
  const x1 = x0 + Math.max(80, W * 0.16), x2 = x3 - Math.max(100, W * 0.2);
  const jx = p.jumpHost ? (x1 + x2) / 2 : null;
  const mid = (x0 + x3) / 2;
  const arc = `M${x0} ${FY - 8} C ${x0 + 8} ${FY - 110}, ${x3 - 8} ${FY - 110}, ${x3} ${FY - 8}`;
  const cross = (cx) => `<path class="cross" d="M${cx - 6} ${FY - 6} l12 12 M${cx + 6} ${FY - 6} l-12 12"/>`;
  const stations = [
    ['app', '应用', '本机', x0, 'start'],
    ['local', '本地端口', `${addr(p)}:${p.localPort}`, x1, 'middle'],
    ...(jx ? [['jump', '跳板机', p.jumpHost, jx, 'middle']] : []),
    ['server', '代理服务器', p.host, x2, 'middle'],
    ['target', '目标站点', '', x3, 'end'],
  ];
  // 窄屏时地址错行排列，避免相邻文字重叠
  const dy = narrow ? (jx ? { local: 14, jump: 28, server: 14 } : { local: 14, target: 14 }) : {};
  const H = FY + 82 + (narrow ? (jx ? 28 : 14) : 0);
  el.innerHTML = `
    <div class="fhead"><span class="chart-title">请求链路（实时）</span><span class="fmeta" id="flowTarget">等待采样</span></div>
    <svg viewBox="0 0 ${W} ${H}">
      <g class="l4" data-s="wait">
        <path class="arc-bg" d="${arc}"/><path class="arc" d="${arc}" pathLength="1"/>
        <g transform="translate(${mid} 44)"><path class="lock-shackle" d="M-6 0 V-6 a6 6 0 0 1 12 0 V-2"/><rect class="lock-body" x="-9" y="0" width="18" height="14" rx="3"/></g>
        <text class="lb lb-tls" x="${mid}" y="92">L4 TLS 握手 <tspan class="ms">–</tspan></text>
      </g>
      <g class="l1" data-s="wait">
        <line class="seg" x1="${x0}" y1="${FY}" x2="${x1}" y2="${FY}"/>
        <text class="lb" x="${x0 + 12}" y="${FY - 16}" style="text-anchor:start">L1 SOCKS5 <tspan class="ms">–</tspan></text>${cross(x1 - 18)}
      </g>
      <g class="l2" data-s="wait">
        <rect class="tube" x="${x1 + 16}" y="${FY - 14}" width="${x2 - x1 - 32}" height="28" rx="14"/>
        <line class="sheen" x1="${x1 + 30}" y1="${FY - 9.5}" x2="${x2 - 30}" y2="${FY - 9.5}"/>
        <line class="cipher" x1="${x1 + 30}" y1="${FY}" x2="${x2 - 30}" y2="${FY}"/>
        <text class="lb" x="${(x1 + x2) / 2}" y="${FY - 24}">L2 SSH 加密隧道 <tspan class="ms">–</tspan></text>
      </g>
      <g class="l3" data-s="wait">
        <line class="tcp" x1="${x2}" y1="${FY}" x2="${x3}" y2="${FY}"/>
        <text class="lb" x="${x3 - 12}" y="${FY - 16}" style="text-anchor:end">L3 TCP <tspan class="ms">–</tspan></text>
        <text class="flag" x="${(x2 + x3) / 2}" y="${FY + 24}">SYN</text>${cross(x3 - 22)}
      </g>
      ${stations.map(([k, name, sub, x, anchor]) => `
        <circle class="ripple" data-k="${k}" cx="${x}" cy="${FY}" r="9"/><circle class="node" data-k="${k}" cx="${x}" cy="${FY}" r="8"/>
        <text class="st-name" x="${x}" y="${FY + 50}" text-anchor="${anchor}">${name}</text>
        <text class="st-addr" x="${x}"  y="${FY + 66 + (dy[k] || 0)}" text-anchor="${anchor}" ${k === 'target' ? 'id="flowTargetAddr"' : ''}>${esc(sub)}</text>`).join('')}
      <g class="packet" style="opacity:0"><circle class="glow" r="11"/><circle class="shell" r="9"/><circle class="pkt" r="5"/></g>
    </svg>
    <div class="fsum" id="flowSum"></div>`;
  Object.assign(el, { _xs: [x0, x1, x2, x3], _jx: jx });
}

// 根据一次探测估算每层耗时：L2 取到服务器的往返时间，L3 为 SOCKS 建连剩余部分
function layerTimes(s, pr) {
  const greet = pr.greetMs ?? null;
  const connect = pr.socksMs != null ? pr.socksMs - (greet || 0) : null;
  const rtt = s.icmpRtt ?? (s.rtt > 5 ? s.rtt : null);
  const tunnel = connect == null ? rtt : rtt != null ? Math.min(rtt, connect) : connect / 2;
  return [greet, tunnel, connect == null ? null : connect - tunnel, pr.tlsMs ?? null];
}

function failAt(pr) {
  if (pr.ok) return -1;
  const e = pr.error || '';
  if (/SOCKS CONNECT/.test(e)) return 2;
  if (/未运行|ECONNREFUSED|SOCKS 建连超时|SOCKS 连接被关闭|认证被拒/.test(e)) return 0;
  return 3;
}

// 每次新采样播放一遍；新采样到来时中断上一遍
async function animateFlow(s) {
  const el = $('#flow');
  const svg = el?.querySelector('svg');
  const probes = s?.probes || [];
  if (!svg || !probes.length) return;
  const gen = (mon.flowGen = (mon.flowGen || 0) + 1);
  const alive = () => mon.flowGen === gen && svg.isConnected;
  mon.flowIdx = ((mon.flowIdx ?? -1) + 1) % probes.length;
  const pr = probes[mon.flowIdx];
  const [x0, x1, x2, x3] = el._xs;
  const times = layerTimes(s, pr);
  const fail = failAt(pr);
  const q = (sel) => svg.querySelector(sel);
  const pkt = q('.packet'), shell = q('.shell'), flag = q('.flag'), sum = $('#flowSum');
  const D = (ms) => (reduceMotion ? 1 : ms);
  const run = async (anim) => (await anim.finished.catch(() => {}), alive());
  const move = (a, b, dur) => pkt.animate([{ transform: `translate(${a}px, ${FY}px)` }, { transform: `translate(${b}px, ${FY}px)` }], { duration: D(dur), easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' });
  const fade = (node, to) => node.animate([{ opacity: to ? 0 : 1 }, { opacity: to }], { duration: D(200), fill: 'forwards' });
  const layer = (n, st, text) => {
    const g = q(`.l${n}`);
    g.dataset.s = st;
    if (text !== undefined) g.querySelector('.ms').textContent = text;
  };
  const ripple = (k) => {
    q(`.node[data-k="${k}"]`).classList.add('done');
    q(`.ripple[data-k="${k}"]`).animate([{ opacity: 0.9, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(2.6)' }], { duration: D(650), easing: 'ease-out' });
  };
  const failed = async (n, text) => {
    layer(n, 'bad', text);
    const c = q(`.l${n} .cross`);
    c?.animate([{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'scale(1)' }], { duration: D(260), fill: 'forwards' });
    fade(pkt, 0);
    for (let i = n + 1; i <= 4; i++) layer(i, 'skip', '未执行');
    sum.textContent = `✕ ${LNAMES[n - 1]}失败：${n === 4 ? pr.error : HINTS[n - 1] || pr.error}`;
    sum.className = 'fsum bad';
  };

  // 复位（保留隧道内的 CSS 动画）
  svg.querySelectorAll('*').forEach((n) => n.getAnimations().forEach((a) => a instanceof CSSAnimation || a.cancel()));
  [1, 2, 3, 4].forEach((n) => layer(n, 'wait', '–'));
  svg.querySelectorAll('.node').forEach((n) => n.classList.remove('done'));
  $('#flowTarget').textContent = `目标 ${nameOf(pr.target)}，${fmtTime(s.t)}`;
  $('#flowTargetAddr').textContent = pr.target;
  sum.textContent = '';
  sum.className = 'fsum';
  pkt.style.transform = `translate(${x0}px, ${FY}px)`;
  pkt.style.opacity = 1;
  ripple('app');

  // L1：应用 → 本地端口
  layer(1, 'run');
  if (fail === 0) return run(move(x0, x0 + (x1 - x0) * 0.6, 260)).then((ok) => ok && failed(1, '失败'));
  if (!(await run(move(x0, x1, 260)))) return;
  ripple('local');
  layer(1, 'ok', msText(times[0]));

  // L2：包上加密壳穿过隧道（经跳板机时中途停一下）
  layer(2, 'run');
  shell.animate([{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'scale(1)' }], { duration: D(220), fill: 'forwards' });
  const dur2 = clamp((times[1] ?? 200) * 1.2, 300, 700);
  if (el._jx) {
    if (!(await run(move(x1, el._jx, dur2 / 2)))) return;
    ripple('jump');
    if (!(await run(move(el._jx, x2, dur2 / 2)))) return;
  } else if (!(await run(move(x1, x2, dur2)))) return;
  fade(shell, 0);
  ripple('server');
  layer(2, 'ok', msText(times[1], true));

  // L3：三次握手
  layer(3, 'run');
  for (const [name, a, b] of [['SYN', x2, x3], ['SYN-ACK', x3, x2], ['ACK', x2, x3]]) {
    flag.textContent = name;
    flag.animate([{ opacity: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 1, offset: 0.8 }, { opacity: 0 }], { duration: D(fail === 2 ? 420 : 240) });
    if (fail === 2) return run(move(a, b - 28, 420)).then((ok) => ok && failed(3, '被拒绝'));
    if (!(await run(move(a, b, 220)))) return;
  }
  ripple('target');
  layer(3, 'ok', msText(times[2], true));

  // L4：TLS 拱桥从应用一路亮到目标，锁扣合上
  fade(pkt, 0);
  layer(4, 'run');
  const dur4 = clamp(times[3] ?? 300, 300, 700);
  if (fail === 3) {
    layer(4, 'bad');
    return run(q('.arc').animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0.4 }], { duration: D(dur4), fill: 'forwards' })).then((ok) => ok && failed(4, '失败'));
  }
  if (!(await run(q('.arc').animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: D(dur4), easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' })))) return;
  if (!(await run(q('.lock-shackle').animate([{ transform: 'translateY(-4px)' }, { transform: 'translateY(0)' }], { duration: D(200), easing: 'ease-in', fill: 'forwards' })))) return;
  layer(4, 'ok', msText(times[3]));
  sum.textContent = `✓ 已建立加密连接，总耗时 ${fmtMs(pr.socksMs + pr.tlsMs)}`;
  sum.className = 'fsum ok';
}

function syncMonitor() {
  const p = cur();
  const on = !!p?.status.running;
  $('#mon').style.display = on ? '' : 'none';
  $('#monIdle').style.display = p && !on ? '' : 'none';
  if (on) openMonitor(p.id);
  else closeMonitor();
}

function closeMonitor() {
  mon.es?.close();
  mon = {};
}

function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('theme', t);
  renderThemeBtn();
}
const renderThemeBtn = () => ($('#themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '☀ 浅色' : '☾ 深色');
renderThemeBtn();

refresh();
setInterval(() => !document.hidden && !dlg.open && ![...document.querySelectorAll('.pwd')].some((i) => i.value) && refresh(), 5000);
</script>
</body>
